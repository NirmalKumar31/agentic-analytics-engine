[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-analytics-engine"
version = "0.1.0"
description = "A bounded multi-agent analytics workflow over DuckDB, with MCP-mediated tools, deterministic statistics, and click-through provenance for every published number."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nirmal Kumar" }]
keywords = ["mcp", "langgraph", "duckdb", "analytics", "agents", "provenance"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Version policy: floors are real requirements, not caution.
#   mcp>=2.2      - v2 renamed FastMCP to MCPServer and replaced the
#                   ClientSession/streamablehttp_client pair with `Client`.
#                   None of this code runs on 1.x.
#   langgraph>=1.2 - `Send` lives in langgraph.types and compile() no longer
#                   takes the 0.x keyword arguments.
#   duckdb>=1.4   - relies on `lock_configuration` making
#                   `enable_external_access=false` irreversible at runtime.
# Upper bounds stop at the next major only.
dependencies = [
    "mcp>=2.2,<3",
    "langgraph>=1.2,<2",
    # Never imported here. It is langgraph's own dependency, named
    # explicitly so a resolver cannot pair langgraph 1.2 with a 0.x
    # langchain-core; `constraints.txt` pins the exact version that was
    # tested.
    "langchain-core>=1.6,<2",
    "duckdb>=1.4,<2",
    "pyarrow>=21,<26.1",
    "scipy>=1.15,<2",
    "numpy>=2.1,<3",
    "sqlglot>=30,<31",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "structlog>=25,<27",
    "httpx>=0.28,<0.29",
    # Governed cloud runs fail closed unless their shared cost ledger is
    # reachable.  This is a runtime dependency, not merely a test helper:
    # production imports it lazily when AI Analytics is enabled.
    "redis>=6,<9",
    "typer>=0.15,<1",
    "rich>=13,<16",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
]
dev = [
    "agentic-analytics-engine[web]",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.13,<0.17",
    "mypy>=1.15,<3",
    "types-pyyaml>=6,<7",
    "pip-audit>=2.9,<3",
    # Exercises the AI cost ledger's Lua against a real Redis command set.
    # The `lua` extra matters: without it `EVAL` is unsupported and the
    # atomicity the ledger depends on would go untested.
    "fakeredis[lua]>=2.38,<3",
]

[project.scripts]
agentic-analytics = "agentic_analytics.cli:app"

[project.urls]
Repository = "https://github.com/NirmalKumar31/agentic-analytics-engine"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_analytics"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store"]

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "docs/", "examples/",
    "web/src/", "web/index.html", "web/package.json", "web/package-lock.json",
    "web/tsconfig.json", "web/tsconfig.node.json", "web/vite.config.ts",
    "pyproject.toml", "constraints.txt", "README.md", "LICENSE",
    "Dockerfile", "render.yaml", "deploy/", "Makefile",
]
exclude = [
    "web/node_modules", "web/dist", "**/*.tsbuildinfo",
    "**/__pycache__", "**/*.pyc", "**/.DS_Store",
    ".pytest_cache", ".mypy_cache", ".ruff_cache",
    "var/", "htmlcov/", ".coverage",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC"]
ignore = [
    "B008",   # typer expresses CLI options as calls in argument defaults
    "RUF012", # ClassVar annotations are not required on pydantic-style attrs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The design-package generators emit SVG from f-strings. A `<text>` element
# broken across lines to fit a column limit is harder to read than the long
# line, and rewrapping one risks changing the sheet it draws -- which is the
# artefact the audit then checks. The typographic characters are deliberate
# too: a mockup shows a real minus sign and a real angle quote, because that
# is what the product renders.
"docs/design/generators/*" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
packages = ["agentic_analytics"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "scipy.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default runs are hermetic: no network, no credentials, no external server.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: requires a live LLM provider (Ollama or a cloud key); excluded by default",
]
filterwarnings = [
    "error::DeprecationWarning:agentic_analytics.*",
]

[tool.coverage.run]
source = ["src/agentic_analytics"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "@overload",
]
