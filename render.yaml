services:
  - type: web
    name: agentic-analytics-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/ready
    autoDeployTrigger: "off"
    envVars:
      - key: AAE_AI_ENABLED
        value: "false"
      - key: AAE_AI_API_KEY
        sync: false
