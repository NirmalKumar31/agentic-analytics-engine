<text x="1190" y="510" fill="#192d35" font-size="24" font-weight="650">Execution contract</text>
<text x="1190" y="547" fill="#58696b" font-size="16" font-weight="400">Operation + measure + groups</text>
<text x="1190" y="574" fill="#58696b" font-size="16" font-weight="400">Filters + period + ordering</text>
<text x="1190" y="601" fill="#58696b" font-size="16" font-weight="400">Coverage + result-shape bounds</text>
