<text x="70" y="128" fill="#192d35" font-size="43" font-weight="700">How an uploaded question becomes a contract</text>
<text x="70" y="170" fill="#58696b" font-size="20" font-weight="400">Routing is by resolver state, and by whether the missing fact is one a model may supply at all.</text>
