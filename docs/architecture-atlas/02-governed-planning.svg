<text x="875" y="560" fill="#192d35" font-size="23" font-weight="650">Governed cloud planner</text>
<text x="875" y="592" fill="#58696b" font-size="18" font-weight="400">Lazy provider + Redis admission</text>
<text x="875" y="619" fill="#58696b" font-size="18" font-weight="400">OpenAI typed plan → validation</text>
<text x="875" y="646" fill="#58696b" font-size="18" font-weight="400">Unavailable or unusable → refusal</text>
<text x="595" y="681" fill="#b3442d" font-size="13" font-weight="700">AMBIGUOUS · SEMANTIC</text>
<text x="595" y="702" fill="#b3442d" font-size="13" font-weight="700">UNRESOLVED · UNSUPPORTED · UNSAFE</text>
