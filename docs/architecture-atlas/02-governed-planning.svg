<text x="1185" y="713" fill="#147c72" font-size="22" font-weight="650">MCP → DuckDB → verify</text>
<text x="1185" y="750" fill="#58696b" font-size="16" font-weight="400">Engine-executed arithmetic.</text>
<text x="1185" y="777" fill="#58696b" font-size="16" font-weight="400">The model does not supply SQL.</text>
<text x="90" y="533" fill="#b3442d" font-size="14" font-weight="700">WHY THE BOUNDARY EXISTS</text>
<text x="90" y="575" fill="#58696b" font-size="20" font-weight="400">A supported number can still answer</text>
<text x="90" y="602" fill="#58696b" font-size="20" font-weight="400">the wrong question. Contract validation</text>
<text x="90" y="629" fill="#58696b" font-size="20" font-weight="400">preserves filters, groups and periods.</text>
<text x="90" y="656" fill="#58696b" font-size="20" font-weight="400">Coverage is checked independently</text>
<text x="90" y="683" fill="#58696b" font-size="20" font-weight="400">of whether two planners agree.</text>
