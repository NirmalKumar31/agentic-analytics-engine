<text x="70" y="300" font-size="11" font-family="ui-monospace,monospace" fill="#5C666F">display / 40 / 700 — the answer, once per page</text>
<text x="70" y="342" font-size="25" font-weight="650" fill="#121619">What the numbers show</text>
<text x="70" y="364" font-size="11" font-family="ui-monospace,monospace" fill="#5C666F">section / 25 / 650 — sentence case, never all-caps</text>
<text x="70" y="402" font-size="17" fill="#49535B">Across category, Apparel has the highest revenue at 1,522,302.</text>
