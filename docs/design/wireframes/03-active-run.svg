<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#F2F4F1"/>
<g font-family="Inter, -apple-system, Segoe UI, sans-serif">
<text x="70" y="52" font-size="11.5" font-weight="700" fill="#0E6E66" letter-spacing=".12em">REDESIGN WIREFRAME · 03-ACTIVE-RUN</text>
<text x="70" y="96" font-size="34" font-weight="700" fill="#121619">Active run</text>
<text x="70" y="126" font-size="16" fill="#49535B">A living timeline of what actually happened — not a static agent DAG.</text>
<line x1="70" y1="152" x2="1530" y2="152" stroke="#DDE2DC"/>
<text x="70" y="186" font-size="12" font-weight="700" fill="#5C666F" letter-spacing=".1em">DESKTOP 1440</text>
<text x="1030" y="186" font-size="12" font-weight="700" fill="#5C666F" letter-spacing=".1em">MOBILE 390</text>
<rect x="70" y="200" width="880" height="44" rx="4" fill="#fff" stroke="#DDE2DC"/>
<text x="82" y="222" font-size="13" font-weight="650" fill="#121619"></text>
<text x="84" y="228" font-size="12.5" font-weight="650" fill="#121619">◆ Agentic Analytics</text>
<text x="400" y="228" font-size="11.5" fill="#5C666F">commerce_demo · 502,819 rows</text>
<text x="800" y="228" font-size="11.5" fill="#5C666F">Governed ▾   ◑   End</text>
<rect x="70" y="256" width="880" height="40" rx="4" fill="#F2F4F1" stroke="#DDE2DC"/>
<text x="82" y="278" font-size="13" font-weight="650" fill="#121619"></text>
<text x="82" y="281" font-size="12" fill="#49535B">“What was total revenue in 2024 using order_date?”</text>
<rect x="70" y="320" width="880" height="92" rx="4" fill="#fff" stroke="#DDE2DC"/>
<text x="82" y="342" font-size="13" font-weight="650" fill="#121619">Run timeline — compact, horizontal</text>
<text x="82" y="362" font-size="11.5" fill="#5C666F">understand → plan → compute → verify → publish</text>
<text x="82" y="378" font-size="11.5" fill="#5C666F">three states each: waiting · active · complete/withheld</text>
<circle cx="160" cy="388" r="11" fill="#0E6E66" stroke="#0E6E66" stroke-width="2"/><text x="160" y="418" font-size="11" fill="#5C666F" text-anchor="middle">understand</text>
<circle cx="330" cy="388" r="11" fill="#0E6E66" stroke="#0E6E66" stroke-width="2"/><text x="330" y="418" font-size="11" fill="#5C666F" text-anchor="middle">plan</text>
<circle cx="500" cy="388" r="11" fill="#fff" stroke="#0E6E66" stroke-width="2"/><text x="500" y="418" font-size="11" fill="#5C666F" text-anchor="middle">compute</text>
<circle cx="670" cy="388" r="11" fill="#fff" stroke="#0E6E66" stroke-width="2"/><text x="670" y="418" font-size="11" fill="#5C666F" text-anchor="middle">verify</text>
<circle cx="840" cy="388" r="11" fill="#fff" stroke="#0E6E66" stroke-width="2"/><text x="840" y="418" font-size="11" fill="#5C666F" text-anchor="middle">publish</text>
<line x1="171" y1="388" x2="239" y2="388" stroke="#0E6E66" stroke-width="2"/>
<line x1="341" y1="388" x2="409" y2="388" stroke="#DDE2DC" stroke-width="2"/>
<line x1="511" y1="388" x2="579" y2="388" stroke="#DDE2DC" stroke-width="2"/>
<line x1="681" y1="388" x2="749" y2="388" stroke="#DDE2DC" stroke-width="2"/>
<rect x="70" y="440" width="880" height="150" rx="4" fill="#fff" stroke="#DDE2DC" stroke-dasharray="5 5"/>
<text x="82" y="462" font-size="13" font-weight="650" fill="#121619">Chart skeleton</text>
<text x="82" y="482" font-size="11.5" fill="#5C666F">becomes the real chart — no fake scanning animation</text>
<rect x="70" y="610" width="200" height="38" rx="4" fill="#fff" stroke="#A63B24"/>
<text x="82" y="632" font-size="13" font-weight="650" fill="#121619">Cancel run</text>
<rect x="1030" y="200" width="190" height="34" rx="4" fill="#fff" stroke="#DDE2DC"/>
<text x="1042" y="222" font-size="13" font-weight="650" fill="#121619"></text>
<rect x="1030" y="244" width="190" height="120" rx="4" fill="#fff" stroke="#DDE2DC"/>
<text x="1042" y="266" font-size="13" font-weight="650" fill="#121619">Timeline</text>
<text x="1042" y="286" font-size="11.5" fill="#5C666F">vertical sequence</text>
<text x="1042" y="302" font-size="11.5" fill="#5C666F">same five stages</text>
<rect x="1030" y="376" width="190" height="120" rx="4" fill="#fff" stroke="#DDE2DC" stroke-dasharray="5 5"/>
<text x="1042" y="398" font-size="13" font-weight="650" fill="#121619">Skeleton</text>
<text x="1042" y="418" font-size="11.5" fill="#5C666F">becomes the chart</text>
<rect x="1030" y="508" width="190" height="38" rx="4" fill="#fff" stroke="#A63B24"/>
<text x="1042" y="530" font-size="13" font-weight="650" fill="#121619">Cancel</text>
<text x="1230" y="186" font-size="12" font-weight="700" fill="#5C666F" letter-spacing=".1em">NOTES</text>
<circle cx="1230" cy="212" r="9" fill="#0E6E66"/><text x="1230" y="216" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="1248" y="216" font-size="12.5" fill="#49535B">Five real stages, each with waiting /</text>
<text x="1248" y="234" font-size="12.5" fill="#49535B">active / complete-or-withheld states.</text>
<circle cx="1230" cy="256" r="9" fill="#0E6E66"/><text x="1230" y="260" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="1248" y="260" font-size="12.5" fill="#49535B">An AI interpretation stage appears only</text>
<text x="1248" y="278" font-size="12.5" fill="#49535B">when a model call actually occurred.</text>
<text x="1248" y="296" font-size="12.5" fill="#49535B">Deterministic routing never fakes one.</text>
<circle cx="1230" cy="318" r="9" fill="#0E6E66"/><text x="1230" y="322" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="1248" y="322" font-size="12.5" fill="#49535B">Removed:</text>
<text x="1248" y="340" font-size="12.5" fill="#A63B24">· the static agent DAG diagram</text>
<text x="1248" y="358" font-size="12.5" fill="#A63B24">· the STAGES card panel</text>
<circle cx="1230" cy="380" r="9" fill="#0E6E66"/><text x="1230" y="384" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="1248" y="384" font-size="12.5" fill="#49535B">Timeline is visible during the run and</text>
<text x="1248" y="402" font-size="12.5" fill="#49535B">afterwards only inside “Show work”.</text>
<circle cx="1230" cy="424" r="9" fill="#0E6E66"/><text x="1230" y="428" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="1248" y="428" font-size="12.5" fill="#49535B">Motion: one trace advances through real</text>
<text x="1248" y="446" font-size="12.5" fill="#49535B">stage transitions; completed stages settle</text>
<text x="1248" y="464" font-size="12.5" fill="#49535B">and stop. No looping once finished.</text>
<circle cx="1230" cy="486" r="9" fill="#0E6E66"/><text x="1230" y="490" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="1248" y="490" font-size="12.5" fill="#49535B">Reduced motion: stages change colour and</text>
<text x="1248" y="508" font-size="12.5" fill="#49535B">label only, no travelling trace.</text>
</g></svg>