<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#F2F4F1"/>
<g font-family="Inter, -apple-system, Segoe UI, sans-serif">
<text x="70" y="52" font-size="11.5" font-weight="700" fill="#0E6E66" letter-spacing=".12em">REDESIGN WIREFRAME · 06-TERMINAL-STATES</text>
<text x="70" y="96" font-size="34" font-weight="700" fill="#121619">Terminal states</text>
<text x="70" y="126" font-size="16" fill="#49535B">Six distinct states. None of them is a generic red error card.</text>
<line x1="70" y1="152" x2="1530" y2="152" stroke="#DDE2DC"/>
<text x="70" y="186" font-size="12" font-weight="700" fill="#5C666F" letter-spacing=".1em">DESKTOP 1440</text>
<text x="1030" y="186" font-size="12" font-weight="700" fill="#5C666F" letter-spacing=".1em">MOBILE 390</text>
<rect x="70" y="200" width="420" height="132" rx="4" fill="#fff" stroke="#0E6E66"/>
<text x="82" y="222" font-size="13" font-weight="650" fill="#121619">Refused</text>
<text x="82" y="242" font-size="11.5" fill="#5C666F">What is ambiguous or unsafe, and how to rephrase it.</text>
<text x="82" y="258" font-size="11.5" fill="#5C666F">“Two date columns could define 2024. Name the one you mean.”</text>
<rect x="520" y="200" width="420" height="132" rx="4" fill="#fff" stroke="#0E6E66"/>
<text x="532" y="222" font-size="13" font-weight="650" fill="#121619">No findings</text>
<text x="532" y="242" font-size="11.5" fill="#5C666F">Execution succeeded; no rows matched, or no values to aggregate.</text>
<text x="532" y="258" font-size="11.5" fill="#5C666F">“240 rows matched. None held a refund_value.”</text>
<rect x="70" y="360" width="420" height="132" rx="4" fill="#fff" stroke="#A63B24"/>
<text x="82" y="382" font-size="13" font-weight="650" fill="#121619">Verification withheld</text>
<text x="82" y="402" font-size="11.5" fill="#5C666F">What could not be verified, and what was therefore not published.</text>
<text x="82" y="418" font-size="11.5" fill="#5C666F">“2 of 6 findings failed numeric re-check and were withheld.”</text>
<rect x="520" y="360" width="420" height="132" rx="4" fill="#fff" stroke="#A63B24"/>
<text x="532" y="382" font-size="13" font-weight="650" fill="#121619">Quota stopped</text>
<text x="532" y="402" font-size="11.5" fill="#5C666F">The budget boundary, without exposing a secret or a provider.</text>
<text x="532" y="418" font-size="11.5" fill="#5C666F">“The AI budget for this period is spent. Deterministic still works.”</text>
<rect x="70" y="520" width="420" height="132" rx="4" fill="#fff" stroke="#A63B24"/>
<text x="82" y="542" font-size="13" font-weight="650" fill="#121619">Failed</text>
<text x="82" y="562" font-size="11.5" fill="#5C666F">Plain language first; technical detail inside a disclosure.</text>
<text x="82" y="578" font-size="11.5" fill="#5C666F">“The query could not be executed. Details ▾”</text>
<rect x="520" y="520" width="420" height="132" rx="4" fill="#fff" stroke="#49535B"/>
<text x="532" y="542" font-size="13" font-weight="650" fill="#121619">Cancelled</text>
<text x="532" y="562" font-size="11.5" fill="#5C666F">States plainly that no final answer was published.</text>
<text x="532" y="578" font-size="11.5" fill="#5C666F">“You stopped this run. Nothing was published.”</text>
<rect x="1030" y="200" width="190" height="34" rx="4" fill="#fff" stroke="#DDE2DC"/>
<text x="1042" y="222" font-size="13" font-weight="650" fill="#121619"></text>
<rect x="1030" y="244" width="190" height="120" rx="4" fill="#fff" stroke="#0E6E66"/>
<text x="1042" y="266" font-size="13" font-weight="650" fill="#121619">Refused</text>
<text x="1042" y="286" font-size="11.5" fill="#5C666F">same hierarchy</text>
<text x="1042" y="302" font-size="11.5" fill="#5C666F">title → reason → action</text>
<text x="1042" y="318" font-size="11.5" fill="#5C666F">full width, no card grid</text>
<rect x="1030" y="376" width="190" height="60" rx="4" fill="#fff" stroke="#0E6E66"/>
<text x="1042" y="398" font-size="13" font-weight="650" fill="#121619">Rephrase →</text>
<text x="1042" y="418" font-size="11.5" fill="#5C666F">the next action is a</text>
<text x="1042" y="434" font-size="11.5" fill="#5C666F">control, not prose</text>
<rect x="1030" y="448" width="190" height="70" rx="4" fill="#F2F4F1" stroke="#DDE2DC" stroke-dasharray="4 4"/>
<text x="1042" y="470" font-size="13" font-weight="650" fill="#121619">Details ▾</text>
<text x="1042" y="490" font-size="11.5" fill="#5C666F">technical text stays</text>
<text x="1042" y="506" font-size="11.5" fill="#5C666F">inside the disclosure</text>
<text x="1230" y="186" font-size="12" font-weight="700" fill="#5C666F" letter-spacing=".1em">NOTES</text>
<circle cx="1230" cy="212" r="9" fill="#0E6E66"/><text x="1230" y="216" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="1248" y="216" font-size="12.5" fill="#49535B">Every state answers three questions:</text>
<text x="1248" y="234" font-size="12.5" fill="#49535B">what happened, what was not published,</text>
<text x="1248" y="252" font-size="12.5" fill="#49535B">and what to do next.</text>
<circle cx="1230" cy="274" r="9" fill="#0E6E66"/><text x="1230" y="278" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="1248" y="278" font-size="12.5" fill="#49535B">Hierarchy carries the difference, not</text>
<text x="1248" y="296" font-size="12.5" fill="#49535B">colour alone — a red box for all six</text>
<text x="1248" y="314" font-size="12.5" fill="#49535B">would make them indistinguishable.</text>
<circle cx="1230" cy="336" r="9" fill="#0E6E66"/><text x="1230" y="340" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="1248" y="340" font-size="12.5" fill="#49535B">Signal colour marks informational states</text>
<text x="1248" y="358" font-size="12.5" fill="#49535B">(refused, no findings); vermilion marks</text>
<text x="1248" y="376" font-size="12.5" fill="#49535B">states needing attention.</text>
<circle cx="1230" cy="398" r="9" fill="#0E6E66"/><text x="1230" y="402" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="1248" y="402" font-size="12.5" fill="#49535B">The next action is a real control, not a</text>
<text x="1248" y="420" font-size="12.5" fill="#49535B">sentence telling the reader to try again.</text>
<circle cx="1230" cy="442" r="9" fill="#0E6E66"/><text x="1230" y="446" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="1248" y="446" font-size="12.5" fill="#49535B">Technical detail sits inside a disclosure</text>
<text x="1248" y="464" font-size="12.5" fill="#49535B">in every state, never on the canvas.</text>
<circle cx="1230" cy="486" r="9" fill="#0E6E66"/><text x="1230" y="490" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="1248" y="490" font-size="12.5" fill="#49535B">Existing refusal wording is preserved</text>
<text x="1248" y="508" font-size="12.5" fill="#49535B">verbatim — these are layout changes,</text>
<text x="1248" y="526" font-size="12.5" fill="#49535B">not new claims about what happened.</text>
</g></svg>