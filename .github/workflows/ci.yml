name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job in this workflow uses a paid credential. The default provider is a
# deterministic scripted stand-in, so every check below runs offline.
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  AAE_PROVIDER_MODE: fake

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Types
        run: |
          mypy
          mypy scripts

      - name: Generate the demo warehouse
        run: python -m agentic_analytics.cli generate-data

      - name: Tests with branch coverage
        run: |
          python -m pytest --cov --cov-branch \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  reproducibility:
    name: Demo data reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - run: python -m pip install --upgrade pip && python -m pip install -c constraints-dev.txt -e ".[dev]"

      - name: Generate twice and compare fingerprints
        run: |
          python -m agentic_analytics.cli generate-data --out var/a
          python -m agentic_analytics.cli generate-data --out var/b
          python - <<'PY'
          from pathlib import Path
          from agentic_analytics.data.generator import warehouse_fingerprint
          a, b = warehouse_fingerprint(Path("var/a")), warehouse_fingerprint(Path("var/b"))
          print("a:", a, "\nb:", b)
          assert a == b, "the generator is not deterministic"
          PY

  mcp:
    name: MCP server and client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - run: python -m pip install --upgrade pip && python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m agentic_analytics.cli generate-data

      - name: In-process and Streamable HTTP integration tests
        run: python -m pytest tests/integration/test_mcp.py -v

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scanning history requires it; the default checkout is shallow.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - run: python -m pip install --upgrade pip && python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m agentic_analytics.cli generate-data

      - name: Adversarial SQL and upload tests
        run: python -m pytest tests/security -v

      - name: pip-audit the pinned runtime closure
        run: python -m pip_audit --strict --progress-spinner off -r constraints.txt

      # The gitleaks binary rather than the action: the action gates on a
      # licence key and wants write permissions to annotate, neither of
      # which this repository needs. Running the binary keeps the scan
      # reproducible with the same config used locally.
      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: "8.29.0"

      - name: Secret scan of the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Secret scan of the full history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  recordings:
    name: Recorded run acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - run: python -m pip install --upgrade pip && python -m pip install -c constraints-dev.txt -e ".[dev]"

      - name: Validate the committed recordings
        run: python -m agentic_analytics.cli validate-recordings

      - name: Recording schema tests
        run: python -m pytest tests/unit/test_recordings.py -v

  evaluation:
    name: Evaluation benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - run: python -m pip install --upgrade pip && python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m agentic_analytics.cli generate-data

      - name: Score the agents against the injected ground truth
        run: python -m agentic_analytics.cli evaluate --out var/evaluation/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: var/evaluation/report.json
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Bundle guard
        # After the build, because it reads dist/. Vega stays lazy and the
        # initial payload stays under its ceiling; the measured baseline is
        # in the script's header.
        run: npm run check:bundle
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error

  wheel:
    name: Wheel build and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install -c constraints.txt dist/*.whl \
            "uvicorn[standard]" "fastapi" "python-multipart"

      - name: The installed package must do the work the image asks of it
        run: |
          /tmp/clean/bin/python -c "import redis; print('redis', redis.__version__)"
          /tmp/clean/bin/python -m agentic_analytics.cli version
          /tmp/clean/bin/python -m agentic_analytics.cli generate-data --out /tmp/wh/commerce
          /tmp/clean/bin/python -m agentic_analytics.cli validate-recordings \
            --directory examples/recordings
          AAE_DATA_DIR=/tmp/wh /tmp/clean/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from agentic_analytics.api.app import create_app
          with TestClient(create_app()) as client:
              health = client.get("/api/health").json()
              print(health)
              assert health["status"] == "ok"
              assert health["demo_warehouse_ready"] is True
          PY

  e2e:
    name: Browser end to end
    runs-on: ubuntu-latest
    needs: [python, frontend]
    # Every ledger record carries this. The ledger outlives a Playwright
    # invocation on purpose -- the three engines share one container's
    # ceilings, so they have to share one ledger -- and the price is that a
    # file left by an earlier job is indistinguishable from this job's
    # unless each line says who wrote it. The attempt is in the id so a
    # re-run of the same workflow is a different job, and a budget assembled
    # from both halves fails rather than averaging them.
    env:
      AAE_E2E_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentic-analytics-engine:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The per-IP ceilings are a few an hour in the real deployment, and
      # the suite uploads and analyses several times per browser from one
      # address. Raised here so every test runs; the production ceilings
      # themselves are covered by tests/security and by the live acceptance
      # run.
      #
      # These are the numbers the suite is measured against, not numbers
      # chosen to make it fit: `web/scripts/check-resource-budget.mjs`
      # holds budgets well inside them and fails the job on a 429, a leaked
      # session, or a total over budget. There is no retry to double
      # anything -- `playwright.config.ts` sets `retries: 0`, because the
      # report guard refuses a flaky result outright, so a retry could only
      # spend the budget twice. `web/e2e/UPLOADS.md` holds the measured
      # cost and the justification for every analysis the suite still asks
      # the engine to perform.
      #
      # `AAE_MAX_ACTIVE_UPLOAD_SESSIONS` is set explicitly. It was not, and
      # the default of 24 was what the first push of the redesign branch
      # exhausted -- a ceiling nothing in the workflow named.
      - name: Boot the container
        run: |
          docker run -d --name aae-e2e -p 8000:8000 \
            -e AAE_LIVE_ANALYTICS_ENABLED=true \
            -e AAE_UPLOADS_ENABLED=true \
            -e AAE_UPLOADS_PER_IP_PER_HOUR=200 \
            -e AAE_ANALYSES_PER_IP_PER_HOUR=200 \
            -e AAE_ANALYSES_PER_SESSION=40 \
            -e AAE_MAX_ACTIVE_UPLOAD_SESSIONS=24 \
            agentic-analytics-engine:e2e
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health

      - name: Install Playwright and all three engines
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      # All three engines. Chromium alone was cheaper and missed real
      # defects: running Firefox and WebKit locally found a textarea with
      # no focus ring, a disclosure summary falling back to the user-agent
      # ring, and a page that scrolled sideways on a phone. None of those
      # were visible to a Chromium-only run, so the saving was illusory.
      #
      # Each engine runs separately so a failure names the engine, and so
      # the zero-skip guard is evaluated per engine rather than across a
      # pooled total that could hide one engine skipping everything.
      # Before the engines, because every result below is only as good as
      # the guard that reads it -- and the guard used not to run at all on a
      # failing run.
      - name: Guard self-tests
        working-directory: web
        # The wrapper, the budget guard, the static source rules, and the
        # source rules applied to this tree. The last one is what stops a
        # billed request being issued by a path the recorder cannot see.
        run: npm run check:guards

      # Once, for the whole job. The three engines share the container's
      # ceilings, so they share one ledger; clearing it between them would
      # make each engine look like the only one.
      - name: Clear the resource ledger
        working-directory: web
        run: rm -rf playwright-ledger

      - name: Chromium end to end
        working-directory: web
        env:
          AAE_E2E_BASE_URL: http://127.0.0.1:8000
          AAE_E2E_BROWSERS: chromium
        run: npm run test:e2e

      # `if: always()` on the two later engines. A failing Firefox step
      # skipped WebKit entirely, so a run that refused a Firefox flake
      # produced no WebKit evidence at all -- and the question "did this
      # change break WebKit" went unanswered for the whole cycle. The job
      # still fails, because a failed step fails it.
      #
      # Firefox skips the same five PDF tests as WebKit.
      - name: Firefox end to end
        if: always()
        working-directory: web
        env:
          AAE_E2E_BASE_URL: http://127.0.0.1:8000
          AAE_E2E_BROWSERS: firefox
          AAE_E2E_ALLOWED_SKIPS: "5"
        run: npm run test:e2e

      # Five skips, all of them `page.pdf()` -- a Chromium-only Playwright
      # API. They are `print.spec.ts`'s four state PDFs (successful,
      # Compare, refusal, no findings) plus the dark-theme one, each gated
      # with an explicit `test.skip` in the spec rather than filtered out
      # of the file, so the guard counts them and a silent zero-test run
      # cannot pass for a clean one.
      #
      # Was "1", for the single browser-PDF test `app.spec.ts` used to
      # carry. That test asserted `%PDF` and a file size over 1kB, which a
      # PDF of a blank page passes; `print.spec.ts` renders the pages and
      # inspects them instead. Everything else print-related runs on all
      # three engines through `emulateMedia({ media: "print" })`, which is
      # not Chromium-only.
      - name: WebKit end to end
        if: always()
        working-directory: web
        env:
          AAE_E2E_BASE_URL: http://127.0.0.1:8000
          AAE_E2E_BROWSERS: webkit
          AAE_E2E_ALLOWED_SKIPS: "5"
        run: npm run test:e2e

      # After all three engines, because the ceilings are shared: the
      # container allows 200 uploads per IP per hour and 24 live upload
      # sessions, and the three engines run from one address inside one
      # hour. Per-engine totals would miss exactly the exhaustion that
      # failed this job.
      - name: Resource budget
        if: always()
        working-directory: web
        env:
          AAE_E2E_LEDGER_ENGINES: chromium,firefox,webkit
        run: node scripts/check-resource-budget.mjs --scope job

      # Traces and screenshots, not only the HTML report. A flake used to be
      # rescued by a retry, so the job passed, so nothing was uploaded --
      # and the trace that would have named the stalled request was
      # discarded with the runner. Retries are off now and the guard
      # refuses a flake outright, so the job fails and this fires;
      # `test-results` is what actually holds the trace.zip and the failure
      # screenshot.
      - name: Capture the container's own account
        if: always()
        run: |
          mkdir -p web/playwright-ledger
          docker logs --timestamps aae-e2e \
            > web/playwright-ledger/container.log 2>&1 || true

      # `always()`, and every engine's evidence separately.
      #
      # This used to be `if: failure()` over shared paths: the three engines
      # wrote one `playwright-results.json`, one `test-results/` and one
      # `playwright-report/`, and Playwright clears its output directory on
      # the way in -- so a Chromium failure investigated after a WebKit run
      # had traces for WebKit only. The ledger was not uploaded at all,
      # which is the one artifact that says what the job cost.
      - name: Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
            web/playwright-results-*.json
            web/playwright-ledger
          if-no-files-found: ignore
          retention-days: 14

      # The whole log, into the artifact, and the tail into the job output.
      #
      # `tail -60` in the job log was all there was, and sixty lines of a
      # three-engine run is the end of WebKit. When a Chromium test fails
      # the server's account of that request is already gone. Written
      # beside the ledger so it is uploaded by the step above -- which runs
      # before this one, so the file has to exist by then.
      - name: Container logs
        if: always()
        run: docker logs aae-e2e 2>&1 | tail -60 || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentic-analytics-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Governed ledger dependency is in the production image
        run: |
          docker run --rm --entrypoint python agentic-analytics-engine:ci \
            -c "import redis; print('redis', redis.__version__)"

      # Uploads are off in the image by default, which is the safe posture
      # for anyone who runs it without reading anything. The public
      # deployment turns them on, so the acceptance run below has to as
      # well or it would be checking a different service.
      - name: Boot the container
        run: |
          docker run -d --name aae \
            -p 8000:8000 \
            -e AAE_LIVE_ANALYTICS_ENABLED=true \
            -e AAE_UPLOADS_ENABLED=true \
            agentic-analytics-engine:ci

      - name: Container smoke test
        run: python scripts/container_smoke.py http://127.0.0.1:8000

      - name: Live acceptance script against the container
        run: python scripts/live_acceptance.py http://127.0.0.1:8000

      # The default container withdraws the MCP endpoint because no host
      # allow-list is configured. That is the fail-closed behaviour, and it
      # means the smoke test above cannot exercise MCP. So a second
      # container is started *with* an allow-list, proving the endpoint
      # negotiates and serves tools when it is configured to.
      - name: MCP endpoint works when a host allow-list is configured
        run: |
          docker run -d --name aae-mcp -p 8002:8000 \
            -e AAE_MCP_ALLOWED_HOSTS=127.0.0.1:8002 \
            -e AAE_LIVE_ANALYTICS_ENABLED=true \
            agentic-analytics-engine:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8002/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          python - <<'SMOKE'
          import json, urllib.request

          BASE = "http://127.0.0.1:8002"

          def rpc(method, params, session=None):
              body = json.dumps(
                  {"jsonrpc": "2.0", "id": 1, "method": method, "params": params}
              ).encode()
              request = urllib.request.Request(f"{BASE}/mcp", data=body, method="POST")
              request.add_header("Content-Type", "application/json")
              request.add_header("Accept", "application/json, text/event-stream")
              if session:
                  request.add_header("Mcp-Session-Id", session)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.headers.get("Mcp-Session-Id"), response.read().decode()

          session, initialized = rpc(
              "initialize",
              {
                  "protocolVersion": "2026-07-28",
                  "capabilities": {},
                  "clientInfo": {"name": "ci", "version": "1"},
              },
          )
          assert "agentic-analytics" in initialized, initialized[:300]
          print("MCP initialize ok; protocol negotiated")

          _, tools = rpc("tools/list", {}, session)
          for name in ("compute_metric", "decompose_change", "statistical_test"):
              assert name in tools, f"{name} missing from tool discovery"
          print("MCP tool discovery ok")

          # A tool call without the session capability must be refused.
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor())
          demo = json.loads(
              opener.open(
                  urllib.request.Request(f"{BASE}/api/datasets/demo", method="POST"),
                  timeout=30,
              ).read()
          )
          _, refused = rpc(
              "tools/call",
              {
                  "name": "list_tables",
                  "arguments": {"session_id": demo["session_id"], "session_key": "wrong"},
              },
              session,
          )
          assert "unknown or expired" in refused, refused[:300]
          print("MCP tool call without the capability is refused")
          SMOKE

      - name: The image must not default to live analysis
        run: |
          docker rm -f aae
          docker run -d --name aae-default -p 8001:8000 agentic-analytics-engine:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8001/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8001/api/health | tee /tmp/default.json
          python -c "
          import json
          health = json.load(open('/tmp/default.json'))
          assert health['live_analytics_enabled'] is False, health
          assert health['execution_mode'] == 'recorded', health
          print('image defaults to recorded mode:', health)
          "

      - name: Container logs
        if: always()
        run: |
          docker logs aae 2>&1 | tail -40 || true
          docker logs aae-e2e 2>&1 | tail -40 || true
          docker logs aae-mcp 2>&1 | tail -20 || true
          docker logs aae-default 2>&1 | tail -20 || true
