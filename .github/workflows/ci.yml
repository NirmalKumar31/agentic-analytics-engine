name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job in this workflow uses a paid credential. The default provider is a
# deterministic scripted stand-in, so every check below runs offline.
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  AAE_PROVIDER_MODE: fake

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Generate the demo warehouse
        run: python -m agentic_analytics.cli generate-data

      - name: Tests with branch coverage
        run: |
          python -m pytest --cov --cov-branch \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  reproducibility:
    name: Demo data reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Generate twice and compare fingerprints
        run: |
          python -m agentic_analytics.cli generate-data --out var/a
          python -m agentic_analytics.cli generate-data --out var/b
          python - <<'PY'
          from pathlib import Path
          from agentic_analytics.data.generator import warehouse_fingerprint
          a, b = warehouse_fingerprint(Path("var/a")), warehouse_fingerprint(Path("var/b"))
          print("a:", a, "\nb:", b)
          assert a == b, "the generator is not deterministic"
          PY

  mcp:
    name: MCP server and client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m agentic_analytics.cli generate-data

      - name: In-process and Streamable HTTP integration tests
        run: python -m pytest tests/integration/test_mcp.py -v

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scanning history requires it; the default checkout is shallow.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m agentic_analytics.cli generate-data

      - name: Adversarial SQL and upload tests
        run: python -m pytest tests/security -v

      - name: pip-audit the pinned runtime closure
        run: python -m pip_audit --strict --progress-spinner off -r constraints.txt

      # The gitleaks binary rather than the action: the action gates on a
      # licence key and wants write permissions to annotate, neither of
      # which this repository needs. Running the binary keeps the scan
      # reproducible with the same config used locally.
      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: "8.29.0"

      - name: Secret scan of the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Secret scan of the full history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  recordings:
    name: Recorded run acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Validate the committed recordings
        run: python -m agentic_analytics.cli validate-recordings

      - name: Recording schema tests
        run: python -m pytest tests/unit/test_recordings.py -v

  evaluation:
    name: Evaluation benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m agentic_analytics.cli generate-data

      - name: Score the agents against the injected ground truth
        run: python -m agentic_analytics.cli evaluate --out var/evaluation/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: var/evaluation/report.json
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error

  wheel:
    name: Wheel build and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install -c constraints.txt dist/*.whl \
            "uvicorn[standard]" "fastapi" "python-multipart"

      - name: The installed package must do the work the image asks of it
        run: |
          /tmp/clean/bin/python -m agentic_analytics.cli version
          /tmp/clean/bin/python -m agentic_analytics.cli generate-data --out /tmp/wh/commerce
          /tmp/clean/bin/python -m agentic_analytics.cli validate-recordings \
            --directory examples/recordings
          AAE_DATA_DIR=/tmp/wh /tmp/clean/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from agentic_analytics.api.app import create_app
          with TestClient(create_app()) as client:
              health = client.get("/api/health").json()
              print(health)
              assert health["status"] == "ok"
              assert health["demo_warehouse_ready"] is True
          PY

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentic-analytics-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container
        run: |
          docker run -d --name aae \
            -p 8000:8000 \
            -e AAE_LIVE_ANALYTICS_ENABLED=true \
            agentic-analytics-engine:ci

      - name: Container smoke test
        run: python scripts/container_smoke.py http://127.0.0.1:8000

      - name: The image must not default to live analysis
        run: |
          docker rm -f aae
          docker run -d --name aae-default -p 8001:8000 agentic-analytics-engine:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8001/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8001/api/health | tee /tmp/default.json
          python -c "
          import json
          health = json.load(open('/tmp/default.json'))
          assert health['live_analytics_enabled'] is False, health
          assert health['execution_mode'] == 'recorded', health
          print('image defaults to recorded mode:', health)
          "

      - name: Container logs
        if: always()
        run: |
          docker logs aae 2>&1 | tail -40 || true
          docker logs aae-default 2>&1 | tail -20 || true
