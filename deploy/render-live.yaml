# Render blueprint for a deployment backed by a real language model.
#
# The difference from `render.yaml` is one setting: AAE_PROVIDER_MODE.
# Everything else -- the MCP tools, the SQL guard, the statistics, the
# verification, the provenance -- is identical, because none of it depends
# on the provider. This file is not "the AI one" and `render.yaml` is not
# "the fake one". Both run the same engine.
#
# The three provider modes, stated precisely, because the difference between
# them is operational and not just a string:
#
#   fake   A deterministic scripted stand-in. No credential, no network call
#          for inference. This is what the public demo runs, and what CI and
#          the recordings run. Question interpretation is rule-based.
#
#   cloud  A hosted model over HTTPS. Needs AAE_CLOUD_API_KEY, set in the
#          Render dashboard rather than in this file. Derived schema and
#          aggregated results leave the server; raw cells of an uploaded
#          file do not, unless AAE_ALLOW_UPLOAD_ROW_DISCLOSURE is turned on.
#
#   local  A model served by Ollama. **Setting this on Render is not enough
#          on its own.** The image built by ./Dockerfile does not contain or
#          start Ollama, and Render gives a web service no sibling process,
#          so AAE_OLLAMA_BASE_URL=http://127.0.0.1:11434 would point at
#          nothing. `local` is for development on a machine that is already
#          running Ollama, or for a deployment where Ollama exists as a
#          separately reachable service and the URL points at that service.
#          Deploying Ollama is out of scope for this repository.
#
# The default below is `fake`, so applying this file unmodified deploys the
# same credential-free service as render.yaml with tighter run budgets.

services:
  - type: web
    name: agentic-analytics-engine-model
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # See the note above before changing this to `local`.
      - key: AAE_PROVIDER_MODE
        value: fake

      - key: AAE_LIVE_ANALYTICS_ENABLED
        value: "true"
      - key: AAE_UPLOADS_ENABLED
        value: "true"

      - key: AAE_BIND_HOST
        value: "0.0.0.0"
      - key: AAE_MCP_ALLOWED_HOSTS
        value: ""
      - key: AAE_SESSION_COOKIE_SECURE
        value: "true"

      - key: AAE_LOG_LEVEL
        value: INFO
      - key: AAE_LOG_JSON
        value: "true"

      - key: AAE_DUCKDB_MEMORY_LIMIT
        value: 384MB
      - key: AAE_DUCKDB_THREADS
        value: "1"

      # Tighter than the scripted deployment: a model call has a real cost
      # and a real latency, so a run gets less room.
      - key: AAE_BUDGETS__MAX_ANALYSIS_TASKS
        value: "4"
      - key: AAE_BUDGETS__MAX_TOOL_CALLS_PER_TASK
        value: "4"
      - key: AAE_BUDGETS__MAX_TOTAL_TOOL_CALLS
        value: "20"
      - key: AAE_BUDGETS__MAX_LLM_CALLS
        value: "24"
      - key: AAE_BUDGETS__MAX_RUNTIME_SECONDS
        value: "180"
      - key: AAE_BUDGETS__QUERY_TIMEOUT_SECONDS
        value: "15"
      - key: AAE_BUDGETS__MAX_RESULT_ROWS
        value: "500"
      - key: AAE_BUDGETS__MAX_UPLOAD_BYTES
        value: "15728640"
      - key: AAE_BUDGETS__MAX_UPLOAD_ROWS
        value: "750000"
      - key: AAE_BUDGETS__MAX_UPLOAD_COLUMNS
        value: "200"

      - key: AAE_SESSION_TTL_SECONDS
        value: "1800"
      - key: AAE_MAX_CONCURRENT_SESSIONS
        value: "12"
      - key: AAE_MAX_ACTIVE_UPLOAD_SESSIONS
        value: "6"
      - key: AAE_UPLOADS_PER_IP_PER_HOUR
        value: "4"
      - key: AAE_ANALYSES_PER_IP_PER_HOUR
        value: "12"
      - key: AAE_ANALYSES_PER_SESSION
        value: "8"
      - key: AAE_MAX_CONCURRENT_ANALYSES
        value: "2"

      # For AAE_PROVIDER_MODE=local only, and only where something is
      # actually listening on this address. See the note at the top.
      - key: AAE_OLLAMA_BASE_URL
        value: http://127.0.0.1:11434

      # For AAE_PROVIDER_MODE=cloud only. `sync: false` keeps the value out
      # of the repository; set it in the Render dashboard.
      - key: AAE_CLOUD_API_KEY
        sync: false
      - key: AAE_CLOUD_MODEL
        value: claude-sonnet-5
